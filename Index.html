<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방귀 대장정 💨</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel (JSX 변환용) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 via-orange-50 to-yellow-100 text-slate-800 min-h-screen p-4">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { 
          Flame, Calendar, Clock, BarChart2, Plus, Trash2, 
          Wind, Award, Heart 
        } = LucideIcons;

        function App() {
          const [activeTab, setActiveTab] = useState('tracker');
          const [logs, setLogs] = useState(() => {
            const saved = localStorage.getItem('gas_logs');
            return saved ? JSON.parse(saved) : {};
          });

          const [currentDate, setCurrentDate] = useState(() => {
            const today = new Date();
            return today.toISOString().split('T')[0];
          });

          const [gasTime, setGasTime] = useState('');
          const [gasIntensity, setGasIntensity] = useState('normal');
          const [gasMood, setGasMood] = useState('silent');

          useEffect(() => {
            localStorage.setItem('gas_logs', JSON.stringify(logs));
          }, [logs]);

          const getTodayLogs = () => logs[currentDate] || [];

          const addGasEntry = (e) => {
            e.preventDefault();
            const timeToUse = gasTime || new Date().toTimeString().slice(0, 5);
            const newEntry = {
              id: Date.now(),
              time: timeToUse,
              intensity: gasIntensity,
              mood: gasMood
            };

            const updatedDayLogs = [...(logs[currentDate] || []), newEntry].sort((a, b) => a.time.localeCompare(b.time));
            setLogs({ ...logs, [currentDate]: updatedDayLogs });
            setGasTime('');
          };

          const deleteEntry = (id) => {
            const updatedDayLogs = (logs[currentDate] || []).filter(item => item.id !== id);
            setLogs({ ...logs, [currentDate]: updatedDayLogs });
          };

          const getCharacterStatus = (count) => {
            if (count === 0) return { name: '평온한 숲의 요정', msg: '아직 개시 전! 배가 부글거릴 준비 중...', color: 'bg-emerald-100 text-emerald-800 border-emerald-300', emoji: '🌿' };
            if (count <= 5) return { name: '귀여운 방귀쟁이 곰돌이', msg: '소소하게 배출 중! 아주 건강한 상태예요.', color: 'bg-blue-100 text-blue-800 border-blue-300', emoji: '🧸' };
            if (count <= 12) return { name: '로켓 부스터 발사대', msg: '추진력이 장난 아닙니다! 고구마 많이 드셨나요?', color: 'bg-yellow-100 text-yellow-800 border-yellow-300', emoji: '🚀' };
            return { name: '화산 폭발 임박 생물체', msg: '경보! 방독면을 착용하세요! 대기 오염 주의보 발령!', color: 'bg-red-100 text-red-800 border-red-300', emoji: '🌋' };
          };

          const todayCount = getTodayLogs().length;
          const currentStatus = getCharacterStatus(todayCount);

          const getTimeSlotData = () => {
            const slots = Array(8).fill(0);
            getTodayLogs().forEach(log => {
              const hour = parseInt(log.time.split(':')[0], 10);
              slots[Math.floor(hour / 3)]++;
            });
            return slots;
          };

          const timeSlotsLabels = ['00-03시', '03-06시', '06-09시', '09-12시', '12-15시', '15-18시', '18-21시', '21-24시'];
          const timeSlotCounts = getTimeSlotData();
          const maxSlotCount = Math.max(...timeSlotCounts, 1);

          const intensityMap = {
            mild: { label: '살랑 산바람', color: 'text-sky-500', bg: 'bg-sky-50' },
            normal: { label: '구수한 보통맛', color: 'text-amber-500', bg: 'bg-amber-50' },
            sonic: { label: '음속의 굉음', color: 'text-orange-500', bg: 'bg-orange-50' },
            toxic: { label: '생화학 무기급', color: 'text-red-600', bg: 'bg-red-50' }
          };

          const moodMap = {
            silent: '소리 없는 암살자 🥷',
            deadly: '강렬한 냄새 폭탄 💣',
            musical: '멜로디언 연주가 🎵'
          };

          return (
            <div className="max-w-md mx-auto bg-white/90 backdrop-blur-md rounded-3xl shadow-xl overflow-hidden border border-orange-200">
              
              <div className="bg-gradient-to-r from-orange-400 to-amber-500 p-5 text-white text-center relative">
                <div className="absolute top-3 right-3 bg-white/20 px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase">
                  동거인 건강 지킴이
                </div>
                <h1 className="text-2xl font-black flex items-center justify-center gap-2">
                  <Wind className="w-8 h-8 text-yellow-100" /> 방귀 대장정 💨
                </h1>
                <p className="text-xs text-orange-100 mt-1 font-medium">일주일 장 건강을 유쾌하게 추적하는 마법의 체크리스트</p>
              </div>

              <div className="bg-orange-50 p-3 border-b border-orange-100 flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <Calendar className="w-5 h-5 text-orange-500" />
                  <span className="text-sm font-bold text-orange-900">기록 날짜:</span>
                </div>
                <input 
                  type="date" 
                  value={currentDate}
                  onChange={(e) => setCurrentDate(e.target.value)}
                  className="bg-white border border-orange-300 text-orange-900 text-sm rounded-xl px-3 py-1.5 font-semibold focus:outline-none"
                />
              </div>

              <div className="p-5">
                <div className={`p-4 rounded-2xl border-2 shadow-sm ${currentStatus.color}`}>
                  <div className="flex items-center gap-4">
                    <div className="text-4xl bg-white p-3 rounded-2xl shadow-inner">{currentStatus.emoji}</div>
                    <div className="flex-1">
                      <span className="text-xs font-extrabold uppercase opacity-75">현재 캐릭터 상태</span>
                      <h3 className="text-lg font-black">{currentStatus.name}</h3>
                      <p className="text-xs font-medium mt-0.5 opacity-90">{currentStatus.msg}</p>
                    </div>
                  </div>
                  <div className="mt-3 pt-3 border-t border-current/15 flex justify-between items-center text-sm font-bold">
                    <span>오늘 총 방귀 횟수:</span>
                    <span className="text-xl px-3 py-0.5 bg-white rounded-xl shadow-sm">{todayCount}회 💨</span>
                  </div>
                </div>
              </div>

              <div className="flex border-b border-orange-100 bg-orange-50/50">
                <button onClick={() => setActiveTab('tracker')} className={`flex-1 py-3 text-sm font-bold flex items-center justify-center gap-2 ${activeTab === 'tracker' ? 'bg-white text-orange-600 border-b-2 border-orange-500' : 'text-slate-500'}`}>
                  <Plus className="w-4 h-4" /> 기록 및 목록
                </button>
                <button onClick={() => setActiveTab('stats')} className={`flex-1 py-3 text-sm font-bold flex items-center justify-center gap-2 ${activeTab === 'stats' ? 'bg-white text-orange-600 border-b-2 border-orange-500' : 'text-slate-500'}`}>
                  <BarChart2 className="w-4 h-4" /> 시간대별 분석
                </button>
              </div>

              <div className="p-5">
                {activeTab === 'tracker' ? (
                  <div className="space-y-5">
                    <form onSubmit={addGasEntry} className="bg-amber-50/60 p-4 rounded-2xl border border-amber-200 space-y-3">
                      <h4 className="text-xs font-black uppercase text-amber-800 flex items-center gap-1.5">
                        <Flame className="w-4 h-4 text-orange-500" /> 새로운 가스 배출 신고하기
                      </h4>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="text-[11px] font-bold text-slate-600 mb-1 block">시간 선택</label>
                          <input type="time" value={gasTime} onChange={(e) => setGasTime(e.target.value)} className="w-full bg-white border border-amber-300 rounded-xl px-3 py-2 text-sm" />
                        </div>
                        <div>
                          <label className="text-[11px] font-bold text-slate-600 mb-1 block">강도 레벨</label>
                          <select value={gasIntensity} onChange={(e) => setGasIntensity(e.target.value)} className="w-full bg-white border border-amber-300 rounded-xl px-3 py-2 text-sm">
                            <option value="mild">🌿 산바람 (약)</option>
                            <option value="normal">💨 보통맛 (중)</option>
                            <option value="sonic">🚀 굉음 (강)</option>
                            <option value="toxic">🌋 생화학급 (특급)</option>
                          </select>
                        </div>
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-slate-600 mb-1 block">특징 태그</label>
                        <select value={gasMood} onChange={(e) => setGasMood(e.target.value)} className="w-full bg-white border border-amber-300 rounded-xl px-3 py-2 text-sm">
                          <option value="silent">🥷 소리 없는 암살자</option>
                          <option value="deadly">💣 강렬한 냄새 폭탄</option>
                          <option value="musical">🎵 멜로디언 연주가</option>
                        </select>
                      </div>
                      <button type="submit" className="w-full bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold py-2.5 rounded-xl shadow-md flex items-center justify-center gap-2">
                        <Plus className="w-5 h-5" /> 방귀 뀐 것 등록하기!
                      </button>
                    </form>

                    <div>
                      <h4 className="text-xs font-black uppercase text-slate-500 tracking-wider mb-3 flex justify-between">
                        <span>오늘의 배출 타임라인</span>
                        <span className="text-orange-500 font-bold">{todayCount}건 기록됨</span>
                      </h4>
                      {todayCount === 0 ? (
                        <div className="text-center py-8 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
                          <p className="text-slate-400 text-sm font-medium">아직 등록된 기록이 없습니다.</p>
                        </div>
                      ) : (
                        <div className="space-y-2 max-h-56 overflow-y-auto pr-1">
                          {getTodayLogs().map((item) => {
                            const info = intensityMap[item.intensity] || intensityMap.normal;
                            return (
                              <div key={item.id} className={`p-3 rounded-xl border border-orange-100 ${info.bg} flex items-center justify-between shadow-sm`}>
                                <div className="flex items-center gap-3">
                                  <span className="text-xs font-black px-2 py-1 bg-white rounded-lg shadow-sm text-slate-700 flex items-center gap-1">
                                    <Clock className="w-3 h-3 text-orange-500" /> {item.time}
                                  </span>
                                  <div>
                                    <div className={`text-xs font-bold ${info.color}`}>{info.label}</div>
                                    <div className="text-[11px] text-slate-500 font-medium">{moodMap[item.mood]}</div>
                                  </div>
                                </div>
                                <button onClick={() => deleteEntry(item.id)} className="text-slate-400 hover:text-red-500 p-1.5 rounded-lg">
                                  <Trash2 className="w-4 h-4" />
                                </button>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  </div>
                ) : (
                  <div className="space-y-5">
                    <div className="bg-orange-50/50 p-4 rounded-2xl border border-orange-200">
                      <h4 className="text-xs font-black uppercase text-orange-900 mb-4 flex items-center gap-2">
                        <BarChart2 className="w-4 h-4 text-orange-500" /> 시간대별 방귀 빈도 및 간격 파악
                      </h4>
                      <div className="space-y-2">
                        {timeSlotCounts.map((count, index) => {
                          const percentage = Math.round((count / maxSlotCount) * 100);
                          return (
                            <div key={index} className="flex items-center gap-2">
                              <span className="text-[11px] font-bold text-slate-600 w-14">{timeSlotsLabels[index]}</span>
                              <div className="flex-1 bg-white h-4 rounded-full overflow-hidden p-0.5 border border-orange-200">
                                <div className="bg-gradient-to-r from-orange-400 to-amber-50
