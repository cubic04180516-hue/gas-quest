<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방귀 대장정 💨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gradient-to-br from-orange-50 via-amber-50 to-yellow-50 min-h-screen text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            // 지정된 기간 (8월 31일 ~ 9월 4일) 날짜 배열 설정
            const targetDays = [
                "2026-08-31",
                "2026-09-01",
                "2026-09-02",
                "2026-09-03",
                "2026-09-04"
            ];
            
            const [selectedDate, setSelectedDate] = useState("2026-08-31");

            const [entries, setEntries] = useState([
                { id: 1, date: "2026-08-31", time: "13:30", sound: "산바람 (소리 없음)", smell: "향긋함 (꽃향기)", note: "프로젝트 시작의 신호" },
                { id: 2, date: "2026-09-01", time: "14:30", sound: "굉음 (천둥소리)", smell: "생화학무기급", note: "고구마의 저주" }
            ]);

            const [time, setTime] = useState("13:00");
            const [sound, setSound] = useState("산바람 (소리 없음)");
            const [smell, setSmell] = useState("무난함");
            const [note, setNote] = useState("");

            const [editingId, setEditingId] = useState(null);

            const filteredEntries = entries.filter(item => item.date === selectedDate);

            const getCharacterStatus = (count) => {
                if (count === 0) return { title: "🌱 평온한 숲의 요정", desc: "아직 장내에 평화가 가득합니다. 가스 제로 상태!", bg: "from-emerald-400 to-teal-500" };
                if (count <= 2) return { title: "🍃 산들바람 연금술사", desc: "살랑살랑 가스가 피어오르는 평화로운 소리 공장.", bg: "from-teal-400 to-cyan-500" };
                if (count <= 4) return { title: "🎺 눈치 없는 트럼펫 연주자", desc: "주변 사람들이 슬슬 콧등을 찡그리기 시작합니다.", bg: "from-amber-400 to-orange-400" };
                if (count <= 7) return { title: "🔥 방귀 대장 불꽃 전사", desc: "출력이 너무 강력해 의자가 들썩거릴 지경!", bg: "from-orange-500 to-red-500" };
                return { title: "🌋 화산 폭발 임박 생물체", desc: "지구 종말 급 가스 포화 상태! 대피령을 선포합니다!", bg: "from-red-600 to-purple-600" };
            };

            const currentStatus = getCharacterStatus(filteredEntries.length);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (editingId !== null) {
                    setEntries(entries.map(item => 
                        item.id === editingId 
                            ? { ...item, time, sound, smell, note: note || "기록 없음" }
                            : item
                    ));
                    setEditingId(null);
                } else {
                    const newEntry = { 
                        id: Date.now(), 
                        date: selectedDate, 
                        time, 
                        sound, 
                        smell, 
                        note: note || "기록 없음" 
                    };
                    setEntries([newEntry, ...entries]);
                }
                setTime("13:00");
                setSound("산바람 (소리 없음)");
                setSmell("무난함");
                setNote("");
            };

            const startEdit = (item) => {
                setEditingId(item.id);
                setTime(item.time);
                setSound(item.sound);
                setSmell(item.smell);
                setNote(item.note);
            };

            const cancelEdit = () => {
                setEditingId(null);
                setTime("13:00");
                setSound("산바람 (소리 없음)");
                setSmell("무난함");
                setNote("");
            };

            const deleteEntry = (id) => {
                setEntries(entries.filter(item => item.id !== id));
                if (editingId === id) cancelEdit();
            };

            const resetDateEntries = () => {
                if (window.confirm("정말 이 날의 모든 기록을 초기화하시겠습니까?")) {
                    setEntries(entries.filter(item => item.date !== selectedDate));
                    cancelEdit();
                }
            };

            const timeSlotsLabels = ["00-03시", "03-06시", "06-09시", "09-12시", "12-15시", "15-18시", "18-21시", "21-24시"];
            const timeSlotCounts = timeSlotsLabels.map((_, index) => {
                return filteredEntries.filter(item => {
                    const hour = parseInt(item.time.split(":")[0]);
                    return Math.floor(hour / 3) === index;
                }).length;
            });
            const maxSlotCount = Math.max(...timeSlotCounts, 1);

            return (
                <div className="max-w-md mx-auto p-4 space-y-6 pb-12">
                    <header className="text-center py-6">
                        <h1 className="text-3xl font-black text-orange-600 flex items-center justify-center gap-2">
                            <span>💨</span> 방귀 대장정
                        </h1>
                        <p className="text-sm text-slate-500 mt-1">8/31 13:00 ~ 9/4 22:00 집중 기간 관리 다이어리</p>
                    </header>

                    {/* 프로젝트 기간 날짜 선택 바 */}
                    <div className="bg-white rounded-3xl p-4 shadow-xl shadow-orange-100/50 border border-orange-100">
                        <div className="flex justify-between items-center mb-2 px-1">
                            <label className="text-xs font-bold text-slate-500">📅 프로젝트 기간 관리 (8/31 ~ 9/4)</label>
                            {filteredEntries.length > 0 && (
                                <button 
                                    onClick={resetDateEntries}
                                    className="text-[11px] font-bold text-red-500 hover:underline bg-red-50 px-2 py-0.5 rounded-lg border border-red-100"
                                >
                                    🗑️ 이 날 기록 리셋
                                </button>
                            )}
                        </div>
                        <div className="grid grid-cols-5 gap-1">
                            {targetDays.map(dateStr => {
                                const dayLabel = dateStr.slice(5).replace('-', '/'); // MM/DD 형태로 표시
                                const isSelected = dateStr === selectedDate;
                                return (
                                    <button
                                        key={dateStr}
                                        onClick={() => { setSelectedDate(dateStr); cancelEdit(); }}
                                        className={`py-2 rounded-xl text-xs font-bold transition flex flex-col items-center gap-0.5 ${
                                            isSelected 
                                                ? 'bg-orange-500 text-white shadow-md shadow-orange-500/30' 
                                                : 'bg-orange-50/50 text-slate-600 hover:bg-orange-100'
                                        }`}
                                    >
                                        <span>{dayLabel}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* 실감나는 코믹 캐릭터 상태 카드 */}
                    <div className={`rounded-3xl p-6 text-white shadow-xl bg-gradient-to-r ${currentStatus.bg} transition-all duration-500 space-y-2`}>
                        <div className="text-xs font-bold opacity-80 uppercase tracking-wider">코믹 캐릭터 상태 변화</div>
                        <div className="text-2xl font-black">{currentStatus.title}</div>
                        <p className="text-sm opacity-90">{currentStatus.desc}</p>
                        <div className="pt-2 text-xs font-bold bg-black/10 inline-block px-3 py-1 rounded-full">
                            선택일 누적 배출: {filteredEntries.length}회
                        </div>
                    </div>

                    {/* 기록 등록 및 수정 폼 */}
                    <form onSubmit={handleSubmit} className="bg-white rounded-3xl p-6 shadow-xl shadow-orange-100/50 border border-orange-100 space-y-4">
                        <div className="flex justify-between items-center">
                            <h2 className="text-lg font-bold text-orange-900">
                                {editingId !== null ? "✏️ 기록 수정하기" : "➕ 방귀 상세 기록하기"}
                            </h2>
                            {editingId !== null && (
                                <button 
                                    type="button" 
                                    onClick={cancelEdit}
                                    className="text-xs font-bold text-slate-400 hover:text-slate-600 bg-slate-100 px-2.5 py-1 rounded-xl"
                                >
                                    수정 취소
                                </button>
                            )}
                        </div>
                        
                        <div className="grid grid-cols-2 gap-3">
                            <div>
                                <label className="text-xs font-bold text-slate-500 mb-1 block">시간</label>
                                <input 
                                    type="time" 
                                    value={time} 
                                    onChange={(e) => setTime(e.target.value)}
                                    className="w-full p-2.5 bg-orange-50/50 border border-orange-200 rounded-xl text-sm font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-orange-400"
                                />
                            </div>
                            <div>
                                <label className="text-xs font-bold text-slate-500 mb-1 block">소리 특징</label>
                                <select 
                                    value={sound} 
                                    onChange={(e) => setSound(e.target.value)}
                                    className="w-full p-2.5 bg-orange-50/50 border border-orange-200 rounded-xl text-sm font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-orange-400"
                                >
                                    <option value="산바람 (소리 없음)">산바람 (소리 없음)</option>
                                    <option value="일반적인 소리">일반적인 소리</option>
                                    <option value="굉음 (천둥소리)">굉음 (천둥소리)</option>
                                </select>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                            <div>
                                <label className="text-xs font-bold text-slate-500 mb-1 block">냄새 및 강도 태그</label>
                                <select 
                                    value={smell} 
                                    onChange={(e) => setSmell(e.target.value)}
                                    className="w-full p-2.5 bg-orange-50/50 border border-orange-200 rounded-xl text-sm font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-orange-400"
                                >
                                    <option value="향긋함 (꽃향기)">향긋함 (꽃향기)</option>
                                    <option value="무난함">무난함</option>
                                    <option value="생화학무기급">생화학무기급</option>
                                </select>
                            </div>
                            <div>
                                <label className="text-xs font-bold text-slate-500 mb-1 block">메모</label>
                                <input 
                                    type="text" 
                                    placeholder="예: 고구마 과다 섭취" 
                                    value={note}
                                    onChange={(e) => setNote(e.target.value)}
                                    className="w-full p-2.5 bg-orange-50/50 border border-orange-200 rounded-xl text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-orange-400"
                                />
                            </div>
                        </div>

                        <button 
                            type="submit"
                            className={`w-full py-3.5 text-white font-bold rounded-2xl shadow-lg transition active:scale-95 ${
                                editingId !== null 
                                    ? 'bg-gradient-to-r from-emerald-500 to-teal-500 shadow-emerald-500/30' 
                                    : 'bg-gradient-to-r from-orange-500 to-amber-500 shadow-orange-500/30'
                            }`}
                        >
                            {editingId !== null ? "💾 수정 완료하기" : "💨 기록 추가하기"}
                        </button>
                    </form>

                    {/* 시간대별 빈도 분석 그래프 */}
                    <div className="bg-white rounded-3xl p-6 shadow-xl shadow-orange-100/50 border border-orange-100 space-y-4">
                        <h2 className="text-lg font-bold text-orange-900">📊 시간대별 빈도 분석 그래프</h2>
                        <div className="space-y-2">
                            {timeSlotCounts.map((count, index) => {
                                const percentage = Math.round((count / maxSlotCount) * 100);
                                return (
                                    <div key={index} className="flex items-center gap-2">
                                        <span className="text-[11px] font-bold text-slate-600 w-14">{timeSlotsLabels[index]}</span>
                                        <div className="flex-1 bg-white h-4 rounded-full overflow-hidden p-0.5 border border-orange-200">
                                            <div className="bg-gradient-to-r from-orange-400 to-amber-500 h-full rounded-full transition-all duration-500" style={{ width: `${percentage}%` }}></div>
                                        </div>
                                        <span className="text-[11px] font-bold text-orange-600 w-6 text-right">{count}회</span>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* 기록 리스트 및 수정/삭제 버튼 */}
                    <div className="bg-white rounded-3xl p-6 shadow-xl shadow-orange-100/50 border border-orange-100 space-y-4">
                        <h2 className="text-lg font-bold text-orange-900">🕒 {selectedDate} 기록 리스트 ({filteredEntries.length}건)</h2>
                        {filteredEntries.length === 0 ? (
                            <p className="text-sm text-slate-400 text-center py-6">선택한 날짜에 기록된 내용이 없습니다.</p>
                        ) : (
                            <div className="space-y-3">
                                {filteredEntries.map(item => (
                                    <div key={item.id} className="flex justify-between items-center p-3.5 bg-orange-50/50 rounded-2xl border border-orange-100">
                                        <div className="space-y-1">
                                            <div className="flex items-center gap-2">
                                                <span className="text-xs font-extrabold text-orange-600">{item.time}</span>
                                                <span className="text-[10px] font-bold px-2 py-0.5 bg-orange-100 text-orange-800 rounded-full">{item.sound}</span>
                                                <span className="text-[10px] font-bold px-2 py-0.5 bg-red-100 text-red-800 rounded-full">{item.smell}</span>
                                            </div>
                                            <p className="text-sm font-medium text-slate-700">{item.note}</p>
                                        </div>
                                        <div className="flex items-center gap-1.5">
                                            <button 
                                                onClick={() => startEdit(item)}
                                                className="px-2.5 py-1.5 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded-xl text-xs font-bold transition"
                                            >
                                                수정
                                            </button>
                                            <button 
                                                onClick={() => deleteEntry(item.id)}
                                                className="px-2.5 py-1.5 bg-slate-100 hover:bg-red-50 text-slate-400 hover:text-red-500 rounded-xl text-xs font-bold transition"
                                            >
                                                삭제
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
