<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방귀 대장정 💨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gradient-to-br from-orange-50 via-amber-50 to-yellow-50 min-h-screen text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [entries, setEntries] = React.useState([
                { id: 1, time: "09:00", mood: "happy", sound: "loud", smell: "strong", note: "아침 출근길 신호" }
            ]);

            return (
                <div className="max-w-md mx-auto p-4 space-y-6">
                    <header className="text-center py-6">
                        <h1 className="text-3xl font-black text-orange-600 flex items-center justify-center gap-2">
                            <span>💨</span> 방귀 대장정
                        </h1>
                        <p className="text-sm text-slate-500 mt-1">오늘 나의 장 건강과 가스 기록</p>
                    </header>

                    <div className="bg-white rounded-3xl p-6 shadow-xl shadow-orange-100/50 border border-orange-100 space-y-4">
                        <h2 className="text-lg font-bold text-orange-900">간편 기록하기</h2>
                        <button 
                            onClick={() => alert('기록 완료!')}
                            className="w-full py-4 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold rounded-2xl shadow-lg shadow-orange-500/30 hover:opacity-95 transition active:scale-95"
                        >
                            💨 방귀 꼈어요! 기록하기
                        </button>
                    </div>

                    <div className="bg-white rounded-3xl p-6 shadow-xl shadow-orange-100/50 border border-orange-100 space-y-4">
                        <h2 className="text-lg font-bold text-orange-900">최근 기록</h2>
                        {entries.length === 0 ? (
                            <p className="text-sm text-slate-400 text-center py-4">아직 기록이 없습니다.</p>
                        ) : (
                            entries.map(item => (
                                <div key={item.id} className="flex justify-between items-center p-3 bg-orange-50/50 rounded-xl border border-orange-100">
                                    <div>
                                        <span className="text-xs font-bold text-orange-600">{item.time}</span>
                                        <p className="text-sm font-medium text-slate-700">{item.note}</p>
                                    </div>
                                    <button 
                                        onClick={() => setEntries(entries.filter(e => e.id !== item.id))}
                                        className="text-slate-400 hover:text-red-500 text-xs"
                                    >
                                        삭제
                                    </button>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
