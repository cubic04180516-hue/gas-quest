<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방귀 대장정 💨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gradient-to-br from-orange-50 via-amber-50 to-yellow-50 min-h-screen text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { Flame, Trash2, Calendar, Smile, Meh, Frown, BarChart2, PlusCircle, Clock, Wind, AlertCircle } = Lucide;

        function App() {
            const [entries, setEntries] = useState([
                { id: 1, time: "09:00", mood: "happy", sound: "loud", smell: "strong", note: "아침 출근길 신호" },
                { id: 2, time: "14:30", mood: "neutral", sound: "soft", smell: "mild", note: "점심후 커피 타임" }
            ]);
            const [time, setTime] = useState(new Date().toTimeString().slice(0, 5));
            const [mood, setMood] = useState("happy");
            const [sound, setSound] = useState("medium");
            const [smell, setSmell] = useState("mild");
            const [note, setNote] = useState("");

            const moodMap = {
                happy: { label: "시원함", color: "text-emerald-500 bg-emerald-50 border-emerald-200" },
                neutral: { label: "보통", color: "text-amber-500 bg-amber-50 border-amber-200" },
                frown: { label: "더부룩/불편", color: "text-rose-500 bg-rose-50 border-rose-200" }
            };

            const addEntry = (e) => {
                e.preventDefault();
                const newEntry = { id: Date.now(), time, mood, sound, smell, note: note || "기록 없음" };
                setEntries([newEntry, ...entries]);
                setNote("");
            };

            const deleteEntry = (id) => {
                setEntries(entries.filter(item => item.id !== id));
            };

            const timeSlotsLabels = ["00-03시", "03-06시", "06-09시", "09-12시", "12-15시", "15-18시", "18-21시", "21-24시"];
            const timeSlotCounts = timeSlotsLabels.map((_, index) => {
                return entries.filter(item => {
                    const hour = parseInt(item.time.split(":")[0]);
                    return Math.floor(hour / 3) === index;
                }).length;
            });
            const maxSlotCount = Math.max(...timeSlotCounts, 1);

            return (
                <div className="max-w-md mx-auto p-4 space-y-6 pb-12">
                    <header className="text-center py-6">
                        <h1 className="text-3xl font-black text-orange-600 flex items-center justify-center gap-2">
                            <span>💨</span> 방귀 대장정
                        </h1>
                        <p className="text-sm text-slate-500 mt-1">오늘 나의 장 건강과 가스 기록 다이어리</p>
                    </header>

                    {/* 기록 입력폼 */}
                    <form onSubmit={addEntry} className="bg-white rounded-3xl p-6 shadow-xl shadow-orange-100/50 border border-orange-100 space-y-4">
                        <h2 className="text-lg font-bold text-orange-900 flex items-center gap-2">
                            <PlusCircle className="w-5 h-5 text-orange-500" /> 방귀 기록하기
                        </h2>
                        
                        <div className="grid grid-cols-2 gap-3">
                            <div>
                                <label className="text-xs font-bold text-slate-500 mb-1 block">시간</label>
                                <input 
                                    type="time" 
                                    value={time} 
                                    onChange={(e) => setTime(e.target.value)}
                                    className="w-full p-2.5 bg-orange-50/50 border border-orange-200 rounded-xl text-sm font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-orange-400"
                                />
                            </div>
                            <div>
                                <label className="text-xs font-bold text-slate-500 mb-1 block">상태/느낌</label>
                                <select 
                                    value={mood} 
                                    onChange={(e) => setMood(e.target.value)}
                                    className="w-full p-2.5 bg-orange-50/50 border border-orange-200 rounded-xl text-sm font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-orange-400"
                                >
                                    <option value="happy">시원함 😊</option>
                                    <option value="neutral">보통 😐</option>
                                    <option value="frown">불편함 😣</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label className="text-xs font-bold text-slate-500 mb-1 block">메모</label>
                            <input 
                                type="text" 
                                placeholder="예: 고구마를 너무 많이 먹었음" 
                                value={note}
                                onChange={(e) => setNote(e.target.value)}
                                className="w-full p-2.5 bg-orange-50/50 border border-orange-200 rounded-xl text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-orange-400"
                            />
                        </div>

                        <button 
                            type="submit"
                            className="w-full py-3.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold rounded-2xl shadow-lg shadow-orange-500/30 hover:opacity-95 transition active:scale-95"
                        >
                            💨 기록 추가하기
                        </button>
                    </form>

                    {/* 시간대별 통계 */}
                    <div className="bg-white rounded-3xl p-6 shadow-xl shadow-orange-100/50 border border-orange-100 space-y-4">
                        <h2 className="text-lg font-bold text-orange-900 flex items-center gap-2">
                            <BarChart2 className="w-5 h-5 text-orange-500" /> 시간대별 빈도 분석
                        </h2>
                        <div className="space-y-2">
                            {timeSlotCounts.map((count, index) => {
                                const percentage = Math.round((count / maxSlotCount) * 100);
                                return (
                                    <div key={index} className="flex items-center gap-2">
                                        <span className="text-[11px] font-bold text-slate-600 w-14">{timeSlotsLabels[index]}</span>
                                        <div className="flex-1 bg-white h-4 rounded-full overflow-hidden p-0.5 border border-orange-200">
                                            <div className="bg-gradient-to-r from-orange-400 to-amber-500 h-full rounded-full transition-all duration-500" style={{ width: `${percentage}%` }}></div>
                                        </div>
                                        <span className="text-[11px] font-bold text-orange-600 w-6 text-right">{count}회</span>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* 최근 기록 리스트 */}
                    <div className="bg-white rounded-3xl p-6 shadow-xl shadow-orange-100/50 border border-orange-100 space-y-4">
                        <h2 className="text-lg font-bold text-orange-900 flex items-center gap-2">
                            <Clock className="w-5 h-5 text-orange-500" /> 최근 기록 리스트 ({entries.length}건)
                        </h2>
                        {entries.length === 0 ? (
                            <p className="text-sm text-slate-400 text-center py-6">아직 기록된 내용이 없습니다.</p>
                        ) : (
                            <div className="space-y-3">
                                {entries.map(item => {
                                    const info = moodMap[item.mood] || moodMap.neutral;
                                    return (
                                        <div key={item.id} className="flex justify-between items-center p-3.5 bg-orange-50/50 rounded-2xl border border-orange-100">
                                            <div className="space-y-1">
                                                <div className="flex items-center gap-2">
                                                    <span className="text-xs font-extrabold text-orange-600">{item.time}</span>
                                                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${info.color}`}>{info.label}</span>
                                                </div>
                                                <p className="text-sm font-medium text-slate-700">{item.note}</p>
                                            </div>
                                            <button 
                                                onClick={() => deleteEntry(item.id)}
                                                className="p-2 text-slate-400 hover:text-red-500 transition"
                                                title="삭제"
                                            >
                                                <Trash2 className="w-4 h-4" />
                                            </button>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
